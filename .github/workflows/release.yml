# Builds ClassDash.app, packages it into a .dmg, and attaches it to a
# GitHub Release — triggered by pushing a tag, not by every commit.
#
# ── Why a tag, not every push to main ──
#
# A release is a deliberate "this is a version someone should be able to
# download" moment, not something that should happen on every commit —
# most commits aren't meant to be installable milestones. Tagging is the
# existing, standard way to mark that moment; nothing new to learn here.
#
#   git tag v1.0.0
#   git push fork v1.0.0
#
# ── Why ad-hoc signing, no notarization ──
#
# Notarization needs a paid Apple Developer Program membership and its
# credentials stored as repository secrets — not something this project
# has. Ad-hoc (build.sh's own fallback when it doesn't find the
# "SHREK School Software Local" certificate, which a fresh CI runner
# obviously never will) is what ships instead. That means Gatekeeper
# shows the "unidentified developer" warning on first launch — expected,
# not a bug, and the README documents the right-click-to-open workaround.
#
# ── Why hdiutil, not a third-party dmg tool ──
#
# hdiutil is already part of macOS (20-browser.js already shells out to
# it, extracting Brave's own .dmg) — no new dependency to install or trust
# just to build one.
#
# ── The Windows build, alongside this one ──
#
# electron/ is a separate wrapper around the exact same 08-page.js /
# 21-notifier-actions.js this app already uses — see electron/main.js's
# own header comment. Packaged here with electron-builder into an NSIS
# installer (the standard choice for a Windows Electron app), same
# ad-hoc/unsigned posture as the macOS build above: no code-signing
# certificate for Windows either, so expect a SmartScreen warning on
# first run, same story as Gatekeeper's above.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# THREE JOBS, NOT ONE, SINCE THE WINDOWS WRAPPER (electron/) SHIPPED —
# the two builds run on different runner OSes and can't share a job. Each
# build job only uploads its artifact as a workflow artifact rather than
# publishing anything itself; a final `publish` job that needs both does
# the one real `gh release create`, so nothing races to create the same
# release twice or attaches an incomplete pair of assets if one
# platform's build is slower than the other's.
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Builds ClassDash.app (ad-hoc signed, see above), installs a copy
      # to /Applications, and registers the napominalka:// scheme — all
      # harmless on a throwaway CI runner. No `npm install` needed first:
      # building the app is pure swiftc + codesign, nothing here touches
      # Playwright or any other Node dependency.
      # VERSION is passed explicitly here, not left to build.sh's own
      # `git describe` fallback: a shallow checkout (actions/checkout's
      # default) doesn't fetch tag history, so describe would only ever
      # see the short hash, not the real tag. GITHUB_REF_NAME IS the
      # tag on this trigger (see the `on: push: tags:` above) — the
      # authoritative version for this exact release build, no guessing.
      - name: Build the app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      # Staged in its own folder, not zipped straight from the repo
      # checkout: a .dmg with just the .app floating in it means dragging
      # the .app to /Applications by hand, easy to get wrong. The symlink
      # makes it the standard drag-app-onto-Applications-icon install
      # every other macOS .dmg uses.
      - name: Stage the disk image contents
        run: |
          mkdir -p dmg-staging
          cp -R "ClassDash.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications

      - name: Build the .dmg
        run: |
          hdiutil create -volname "ClassDash" -srcfolder dmg-staging \
            -ov -format UDZO "ClassDash-${GITHUB_REF_NAME}.dmg"

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ClassDash-${{ github.ref_name }}.dmg

  build-windows:
    runs-on: windows-latest
    defaults:
      # Matches the macOS job's bash syntax (${GITHUB_REF_NAME#v})
      # instead of the runner's own default of PowerShell — one shell
      # dialect to maintain across both jobs, not two.
      run:
        shell: bash
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # THE ROOT PROJECT'S OWN DEPENDENCIES — CONFIRMED MISSING FROM
      # EVERY DEV BUILD THIS SAME GAP PRODUCED (see windows-dev-
      # build.yml's identical fix): electron/package.json's own
      # extraResources bundles ../node_modules into ProjectTemplate, but
      # nothing here ever installed it — only electron/'s own `npm ci`
      # ran, never touching playwright/selfsigned at the repo root.
      # Verified directly by extracting a real built installer:
      # ProjectTemplate/node_modules simply didn't exist, so any
      # brand-new project folder built from it would crash immediately
      # on require('playwright'). Would have shipped in a real release
      # if this hadn't been caught first.
      - name: Install the root project's own dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      # electron-builder reads the version to embed from package.json by
      # default; -c.extraMetadata.version overrides that with the actual
      # release tag instead — the same authoritative source build.sh's
      # own VERSION uses above, not electron/package.json's placeholder
      # "1.0.0".
      - name: Build the installer
        run: npx electron-builder --win nsis -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/dist/*.exe

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      # --generate-notes: auto-built from commits since the last tag —
      # good enough by default, no changelog file to hand-maintain here.
      # No actions/checkout here — gh infers which repo from GH_REPO
      # below instead, since nothing else in this job needs a working
      # tree.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "ClassDash ${GITHUB_REF_NAME}" \
            --generate-notes
